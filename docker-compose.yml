# Local development database only. Synthetic data only; credentials below are local dev placeholders.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hrms_dev
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_local_only
    ports:
      - "5432:5432"
    volumes:
      - hrms_pg:/var/lib/postgresql/data
volumes:
  hrms_pg:
