# Installed as /etc/nginx/snippets/hrms-proxy.conf: what every proxied request carries (the API and Keycloak see the public origin).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $hrms_connection_upgrade;
proxy_connect_timeout 10s;
# Read and send timeouts: nginx's 60 s unless a location sets its own (a directive may appear only once per location).
