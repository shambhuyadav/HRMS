# Installed as /etc/nginx/snippets/hrms-app-headers.conf: browser protections for the web app's own pages (not for Keycloak, which sets
# its own). The app loads only its own scripts and styles, talks only to this origin, and is never framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Repeated here because a location with its own add_header does not inherit the server's (see sites-available/hrms).
add_header Strict-Transport-Security "max-age=31536000" always;
