# Installed as /etc/nginx/snippets/hrms-site.conf: the HRMS site itself, the same for the public address and for the server's own checks
# on 127.0.0.1 (both server blocks in /etc/nginx/sites-available/hrms include it).
#   /            the web app (/var/www/html/HRMS/public, copied from the release; every unknown path is index.html)
#   /v1/ /sign-in/ /health /ready   the HRMS API on 127.0.0.1:3000 (never exposed directly)
#   /kc/         the sign-in provider (Keycloak on 127.0.0.1:8080, relative path /kc)
# Anything else the API has (development sign-in, metrics) is not reachable from outside.

# Largest API body: an import or upload of 10 MiB sent as base64 (~14 MiB).
client_max_body_size 16m;

access_log /var/log/nginx/hrms.access.log;
error_log  /var/log/nginx/hrms.error.log warn;

# The web app's built files only (install-release.sh copies them here from the release). Everything else in /var/www/html/HRMS (the
# project's code, the links to settings, uploads and backups) is beside this folder, not in it, so no address reaches it.
root /var/www/html/HRMS/public;
index index.html;

# No dot-files anywhere (.git, .env, editor leftovers), except the standard /.well-known/ paths (Keycloak's discovery document).
location ~ /\.(?!well-known/) {
  return 404;
}

# ---- The web app -------------------------------------------------------------------------------------------------------------------
location / {
  try_files $uri /index.html;
  include /etc/nginx/snippets/hrms-app-headers.conf;
}
location = /index.html {
  add_header Cache-Control "no-store" always;
  include /etc/nginx/snippets/hrms-app-headers.conf;
}
# Built assets carry a content hash in their names.
location /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/snippets/hrms-app-headers.conf;
}

# ---- The HRMS API ------------------------------------------------------------------------------------------------------------------
location /v1/ {
  limit_req zone=hrms_api burst=80 nodelay;
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:3000;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
}
location /sign-in/ {
  limit_req zone=hrms_sign_in burst=10 nodelay;
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:3000;
}
location = /health {
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:3000;
}
location = /ready {
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:3000;
}
# The development sign-in is refused by the production API as well; it is not even forwarded.
location /dev/ {
  return 404;
}

# ---- The sign-in provider (Keycloak) -----------------------------------------------------------------------------------------------
# Keycloak's own administration (the master realm: its super-administrators, every realm's settings) is not reachable from outside;
# it is administered on the server (deploy/keycloak/configure-realm.sh). People are managed in the hrms realm's console,
# /kc/admin/hrms/console/, behind the same password + authenticator app sign-in as the HRMS. The self-service account pages are
# closed too (a user cannot change the email their HRMS account is found by; passwords are reset by an administrator).
# (Regular-expression locations are matched in order: these come before the login rate limit below.)
location ~ ^/kc/(realms/master|admin/master|admin/realms/master|realms/[^/]+/account)(/|$) {
  return 403;
}
location = /kc {
  return 302 /kc/admin/hrms/console/;
}
location = /kc/ {
  return 302 /kc/admin/hrms/console/;
}
location = /kc/admin/ {
  return 302 /kc/admin/hrms/console/;
}
location /kc/ {
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:8080;
  # Keycloak's cookies and redirects are large.
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
}
location ~ ^/kc/realms/[^/]+/login-actions/authenticate {
  limit_req zone=hrms_provider_login burst=20 nodelay;
  include /etc/nginx/snippets/hrms-proxy.conf;
  proxy_pass http://127.0.0.1:8080;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
}
